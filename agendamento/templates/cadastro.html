{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Barbearia Estilo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'style/style.css' %}" rel="stylesheet">
</head>
<body>
    <div class="pagina-agendamento">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="form-box">
                        <h2>Criar conta</h2>

                        {% if erro %}
                            <p class="text-danger text-center">{{ erro }}</p>
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Nome completo</label>
                                <input type="text" class="form-control" name="nome" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Telefone</label>
                                <input type="text" class="form-control" name="telefone" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Data de Nascimento</label>
                                <input type="date" class="form-control" name="data_nascimento" required>
                            </div>

                            <div class="mb-3">
    <label class="form-label">Sexo</label>
    <select class="form-select" name="sexo" required>
        <option value="feminino">Feminino</option>
        <option value="masculino">Masculino</option>
    </select>
</div>

                            <div class="mb-3">
                                <label class="form-label">Usuário</label>
                                <input type="text" class="form-control" name="username" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <input type="password" class="form-control" name="senha" required>
                            </div>

                            <button type="submit" class="btn btn-dourado w-100 py-2 mt-3">Cadastrar</button>
                        </form>

                        <p class="text-center mt-3">
                            <a href="{% url 'login' %}">Já tem conta? Entrar</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
