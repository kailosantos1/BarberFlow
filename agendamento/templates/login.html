{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ empresa.nome|default:"BarberFlow" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'style/style.css' %}" rel="stylesheet">
</head>
<body>
    <div class="pagina-auth">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="form-box-auth" id="cardAuth">
                        <div class="icone-topo">💈</div>
                        <h2>Entrar</h2>
                        <p class="subtitulo">{{ empresa.nome }}</p>

                        {% if erro %}
                            <p class="text-danger text-center">{{ erro }}</p>
                        {% endif %}

                        <form method="POST" action="{% url 'login' slug=empresa.slug %}">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Usuário</label>
                                <input type="text" class="form-control" name="username" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <input type="password" class="form-control" name="password" required>
                            </div>

                            <button type="submit" class="btn btn-dourado w-100 py-2 mt-3">Entrar</button>
                        </form>

                        <p class="text-center mt-3">
                            <a href="{% url 'cadastro' slug=empresa.slug %}">Não tem conta? Cadastre-se</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const card = document.getElementById('cardAuth');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const rotX = ((y / rect.height) - 0.5) * -10;
            const rotY = ((x / rect.width) - 0.5) * 10;
            card.style.transform = `perspective(800px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(800px) rotateX(0) rotateY(0)';
        });
    </script>
</body>
</html>
